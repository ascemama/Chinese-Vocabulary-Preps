[project]
name = "chinese-vocabulary-preps"
version = "0.1.0"
description = "Utilities to prepare Chinese and Arabic vocabulary study material from Google Sheets and local files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "arabic-reshaper==3.0.0",
  "cachetools==5.3.2",
  "certifi==2023.11.17",
  "charset-normalizer==3.3.2",
  "dnspython==2.8.0",
  "docx==0.2.4",
  "dragonmapper==0.2.6",
  "google-auth==2.25.1",
  "google-auth-oauthlib==1.1.0",
  "gspread==5.12.2",
  "hanzidentifier==1.2.0",
  "httplib2==0.22.0",
  "idna==3.6",
  "lxml==4.9.3",
  "oauth2client==4.1.3",
  "oauthlib==3.2.2",
  "Pillow==10.1.0",
  "pyasn1==0.5.1",
  "pyasn1-modules==0.3.0",
  "pymongo==4.15.5",
  "pyparsing==3.1.1",
  "python-bidi==0.6.7",
  "python-docx==1.1.0",
  "requests==2.31.0",
  "requests-oauthlib==1.3.1",
  "rsa==4.9",
  "six==1.16.0",
  "typing_extensions==4.8.0",
  "urllib3==2.1.0",
  "zhon==2.0.2",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false
